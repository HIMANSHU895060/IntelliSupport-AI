services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: intellisupport
      POSTGRES_USER: intellisupport
      POSTGRES_PASSWORD: change-this-local-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellisupport"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://intellisupport:change-this-local-password@db:5432/intellisupport
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  mcp:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://intellisupport:change-this-local-password@db:5432/intellisupport
    command: ["python", "-m", "mcp_server.server"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
